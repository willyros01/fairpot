# Fairpot — build the iOS app in the cloud and send it to TestFlight.
#
# Runs on every push to main that changes the app, and from the
# "Run workflow" button on the Actions tab. Until the four Apple secrets
# are added (see HANDOVER.md) it skips itself cleanly instead of failing.
#
# Nothing here needs Xcode on your own devices: GitHub's Mac does it all.

name: iOS build to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    # macos-26 carries Xcode 26, which Capacitor 8 and the App Store require.
    # If GitHub ever rejects this label, change it to macos-15.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check the Apple secrets are set
        id: check
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice title=Build skipped::The four Apple secrets are not set yet. See HANDOVER.md, step 4."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the code
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        if: steps.check.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node 22
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Generate the iOS project
        if: steps.check.outputs.ready == 'true'
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Permissions text, encryption answer and app icon
        if: steps.check.outputs.ready == 'true'
        run: |
          PLIST=ios/App/App/Info.plist
          plutil -replace NSCameraUsageDescription -string "Fairpot uses the camera to photograph receipts you choose to attach to an expense." "$PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "Fairpot opens your photo library so you can attach a receipt photo to an expense." "$PLIST"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"
          plutil -replace CFBundleDisplayName -string "Fairpot" "$PLIST"

          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          cp resources/icon.png "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images": [
              { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

      - name: Load the App Store Connect key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build and sign
        if: steps.check.outputs.ready == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice title=Uploaded::Build ${{ github.run_number }} sent to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Remove the key from the build machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
